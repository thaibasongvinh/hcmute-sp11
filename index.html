<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060708" />
    <meta
      name="description"
      content="HCM-UTE: Giao Thức An Ninh 11 — mini-game ôn tập Bài 11: Những vấn đề cơ bản về bảo vệ an ninh quốc gia và giữ gìn trật tự, an toàn xã hội."
    />
    <link rel="icon" type="image/png" href="/hcmute-sp11/favicon.png" />
    <link rel="modulepreload" crossorigin href="/hcmute-sp11/assets/rolldown-runtime-hePW80VL.js" />
    <link rel="stylesheet" crossorigin href="/hcmute-sp11/assets/index-DrmXDgNf.css" />
    <title>HCM-UTE · Giao Thức An Ninh 11</title>
    <script type="module">
      const root = document.querySelector("#root");

      function readSaved(key) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? null : JSON.parse(value);
        } catch {
          return null;
        }
      }

      function migrateTemporarySave() {
        try {
          if (localStorage.getItem("hcmute-sp11:save:v1") !== null) return;

          const calledIds = readSaved("hcmute-sp11-called-v1");
          const best = readSaved("hcmute-sp11-best-v1");
          const preferences = readSaved("hcmute-sp11-preferences-v1");
          if (calledIds === null && best === null && preferences === null) return;

          const pointsPerQuestion = 100;
          const called = Object.fromEntries(
            (Array.isArray(calledIds) ? calledIds : []).map((id) => [id, { count: 1 }])
          );
          const bestScore = best !== null && Number.isFinite(Number(best))
            ? Math.min(12, Math.max(0, Math.round(Number(best) / pointsPerQuestion)))
            : null;
          const settings = {
            soundEnabled: typeof preferences?.sfx === "boolean" ? preferences.sfx : true,
            musicEnabled: typeof preferences?.bgm === "boolean" ? preferences.bgm : true,
            motion: "system"
          };
          localStorage.setItem("hcmute-sp11:save:v1", JSON.stringify({ called, settings, bestScore, runsCompleted: 0 }));
        } catch {
          // Keep the original game's default save if storage is unavailable.
        }
      }

      async function startGame() {
        try {
          const [questionsResponse, studentsResponse] = await Promise.all([
            fetch("/hcmute-sp11/data/questions.json"),
            fetch("/hcmute-sp11/data/students.json")
          ]);
          if (!questionsResponse.ok || !studentsResponse.ok) {
            throw new Error("Không tải được dữ liệu câu hỏi hoặc danh sách lớp.");
          }

          const [questions, students] = await Promise.all([
            questionsResponse.json(),
            studentsResponse.json()
          ]);
          if (!Array.isArray(questions) || !Array.isArray(students)) {
            throw new Error("Dữ liệu câu hỏi hoặc danh sách lớp không đúng định dạng.");
          }

          window.__HCMUTE_EDITABLE_CONTENT__ = { questions, students };
          migrateTemporarySave();
          await import("/hcmute-sp11/assets/index-bspM8P2D.js");
        } catch (error) {
          const screen = document.createElement("main");
          screen.className = "loading-screen";
          const heading = document.createElement("h1");
          heading.textContent = "KHÔNG TẢI ĐƯỢC DỮ LIỆU";
          const message = document.createElement("p");
          message.textContent = String(error?.message || error);
          screen.replaceChildren(heading, message);
          root.replaceChildren(screen);
        }
      }

      startGame();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="loading-screen" aria-live="polite">
        <span class="loading-mark">HCM-UTE</span>
        <p>ĐANG TẢI DỮ LIỆU NHIỆM VỤ…</p>
      </main>
    </div>
    <noscript>Trò chơi cần bật JavaScript.</noscript>
  </body>
</html>
